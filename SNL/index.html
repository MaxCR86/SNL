  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  opacity:0; transition:opacity .5s ease;\n  animation:tier-orbit var(--tcr-spd) linear infinite;\n  animation-play-state:paused;\n}\n.tier-c-row.tcr-active .tier-border-light { opacity:1; animation-play-state:running; }\n.tier-c-row[data-tier=\"track\"] .tier-border-light { transition-duration:.2s; }\n\n/* speeds */\n.tier-c-row[data-tier=\"innov\"] { --tcr-spd:8s; cursor:pointer; }\n.tier-c-row[data-tier=\"track\"] { cursor:pointer; }\n.tier-c-row[data-tier=\"title\"] { cursor:pointer; }\n.tier-c-row[data-tier=\"track\"] { --tcr-spd:4s; }\n.tier-c-row[data-tier=\"title\"] { --tcr-spd:2.8s; }\n\n/* comet colours */\n.tier-c-row[data-tier=\"innov\"] { --cc:rgba(128,130,148,1);--cm:rgba(128,130,148,.5);--cl:rgba(128,130,148,.12); }\n.tier-c-row[data-tier=\"track\"] { --cc:rgba(162,152,122,1);--cm:rgba(162,152,122,.5);--cl:rgba(162,152,122,.12); }\n.tier-c-row[data-tier=\"title\"] { --cc:rgba(215,172, 68,1);--cm:rgba(215,172, 68,.5);--cl:rgba(215,172, 68,.12); }\n\n/* Twin Sparks \u2014 two comets 180\u00b0 apart */\n.tier-border-light {\n  background:conic-gradient(from var(--ba),\n    var(--cl)   0%,  var(--cc)  4%, var(--cm)  7%, transparent 11%,\n    transparent 49%, var(--cl) 50%, var(--cc) 54%, var(--cm)   57%,\n    transparent 61%, transparent 100%\n  );\n}\n\n/* inner glow ring */\n.tier-c-row[data-tier=\"innov\"].tcr-active { box-shadow:inset 0 0 28px rgba(100,104,148,.12); }\n.tier-c-row[data-tier=\"track\"].tcr-active  { box-shadow:inset 0 0 32px rgba(162,152,122,.12); }\n.tier-c-row[data-tier=\"title\"].tcr-active  {\n  box-shadow:inset 0 0 38px rgba(215,172,68,.14),\n             0 0 0 1px rgba(215,172,68,.08),\n             0 8px 40px rgba(215,172,68,.05);\n}\n\n/* z-index lift for text above canvas */\n.tier-c-row > *:not(canvas):not(.tier-border-light) { position:relative; z-index:1; }\n\n/* title tier text glow */\n.tier-c-row[data-tier=\"title\"].tcr-active .tier-c-num  { text-shadow:0 0 28px rgba(215,172,68,.55); }\n.tier-c-row[data-tier=\"title\"].tcr-active .tier-c-name { text-shadow:0 0 30px rgba(215,172,68,.18); }\n.tier-c-row[data-tier=\"title\"].tcr-active .tier-c-price{ text-shadow:0 0 20px rgba(215,172,68,.5); }\n.tier-c-num  { transition:text-shadow .4s; }\n.tier-c-name { transition:text-shadow .4s; }\n.tier-c-price { transition:text-shadow .4s; }\n\n/* innov subtle num glow */\n.tier-c-row[data-tier=\"innov\"].tcr-active .tier-c-num { text-shadow:0 0 18px rgba(128,132,165,.4); }\n\n/* \u2500\u2500 per-tier fade-OUT durations (non-active = target state on deactivate) \u2500\u2500 */\n.tier-c-row[data-tier=\"track\"] canvas,\n.tier-c-row[data-tier=\"track\"] .tier-border-light { transition-duration:.69s; }\n.tier-c-row[data-tier=\"title\"] canvas,\n.tier-c-row[data-tier=\"title\"] .tier-border-light { transition-duration:.83s; }\n\n/* \u2500\u2500 per-tier fade-IN durations (active = target state on activate) \u2500\u2500 */\n.tier-c-row[data-tier=\"innov\"].tcr-active canvas,\n.tier-c-row[data-tier=\"innov\"].tcr-active .tier-border-light { transition-duration:.3s; }\n.tier-c-row[data-tier=\"track\"].tcr-active canvas,\n.tier-c-row[data-tier=\"track\"].tcr-active .tier-border-light { transition-duration:.22s; }\n.tier-c-row[data-tier=\"title\"].tcr-active canvas,\n.tier-c-row[data-tier=\"title\"].tcr-active .tier-border-light { transition-duration:.35s; }\n\n/* \u2500\u2500 mobile readability pass \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n@media(max-width:860px){\n  /* Nav: hide wordmark so CTA fits cleanly */\n  .nav-logo { display:none; }\n  nav .nav-inner { justify-content:flex-end; }\n\n  /* Hero */\n  .hero-tagline { font-size:clamp(16px,4.2vw,20px) !important; }\n  .hero-date { font-size:15px; }\n  .sc-lbl { font-size:15px; }\n\n  /* Section kickers & labels */\n  .s-kicker { font-size:15px; }\n  .g-lbl { font-size:15px; }\n\n  /* Forces/glance body text */\n  .f-desc { font-size:16px; }\n\n  /* Track tiles */\n  .t-name { font-size:14px; }\n\n  /* Peek panel */\n  .peek-stat-l { font-size:14px; }\n  .peek-cue { font-size:14px; }\n\n  /* Track detail panel */\n  .td-kicker { font-size:15px; }\n  .td-sub { font-size:16px; }\n  .td-stat-l { font-size:15px; }\n  .td-spkr-lbl { font-size:15px; }\n\n  /* Sponsorship tier labels */\n  .tier-c-upto { font-size:14px; }\n  .tier-c-unit { font-size:14px; }\n  .spons-note { font-size:16px; }\n\n  /* Footer */\n  .footer-col-label { font-size:14px; }\n  .footer-nav a { font-size:15px; }\n  .footer-contact-note { font-size:16px; }\n  .footer-legal { font-size:14px; }\n}\n/style>\n<style>\n/* \u2500\u2500 tokens \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n:root {\n  --bg:   #000;\n  --sur:  #0D0D0D;\n  --rsd:  #191919;\n  --gld:  #E8C840;\n  --wht:  #FFFFFF;\n  --slv:  #AAAAAA;\n  --slt:  #585858;\n  --ln:   rgba(255,255,255,0.07);\n  --ln2:  rgba(255,255,255,0.13);\n  --ease: cubic-bezier(0.22,1,0.36,1);\n  --font: 'Space Grotesk', system-ui, sans-serif;\n}\n*,*::before,*::after { box-sizing: border-box; }\n* { margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: var(--font);\n  background: var(--bg);\n  color: var(--wht);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n  scroll-snap-type: y proximity;\n}\n.w { max-width: 1280px; margin: 0 auto; padding: 0 clamp(24px,5vw,80px); }\n.hero .w { flex: 1; display: flex; flex-direction: column; padding-top: clamp(28px,19vh,52px); }\n\n/* \u2500\u2500 hero animations \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n@keyframes fadeUp   { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:none} }\n@keyframes drawRule { from{transform:scaleX(0)} to{transform:scaleX(1)} }\n@keyframes scrollDot{\n  0%   { top:-10px; opacity:0; }\n  20%  { opacity:1; }\n  80%  { opacity:1; }\n  100% { top:100%; opacity:0; }\n}\n\n/* \u2500\u2500 scroll reveal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n[data-reveal] {\n  opacity:0; transform:translateY(20px);\n  transition: opacity .75s var(--ease), transform .75s var(--ease);\n}\n[data-reveal].in { opacity:1; transform:none; }\n[data-d=\"1\"]{transition-delay:.08s} [data-d=\"2\"]{transition-delay:.16s}\n[data-d=\"3\"]{transition-delay:.24s} [data-d=\"4\"]{transition-delay:.32s}\n[data-d=\"5\"]{transition-delay:.40s} [data-d=\"6\"]{transition-delay:.48s}\n[data-d=\"7\"]{transition-delay:.56s} [data-d=\"8\"]{transition-delay:.64s}\n\n/* \u2500\u2500 nav \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nnav {\n  position:fixed; top:0; left:0; right:0; z-index:100;\n  height:52px; display:flex; align-items:center;\n  border-bottom:1px solid var(--ln);\n  background:rgba(0,0,0,.75);\n  backdrop-filter:blur(16px);\n  -webkit-backdrop-filter:blur(16px);\n  opacity:0; pointer-events:none;\n  transition:opacity .5s var(--ease);\n}\nnav.show { opacity:1; pointer-events:all; }\n.nav-inner { display:flex; align-items:center; justify-content:space-between; width:100%; }\n.nav-logo { font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--wht); text-decoration:none; white-space:nowrap; }\n.nav-logo b { color:var(--gld); }\n.nav-cta {\n  font-size:14px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;\n  color:var(--gld); text-decoration:none; white-space:nowrap;\n  border:1px solid rgba(232,200,64,.28); padding:8px 16px; border-radius:2px;\n  transition:border-color .2s,background .2s;\n}\n.nav-cta:hover { border-color:var(--gld); background:rgba(232,200,64,.05); }\n\n/* \u2500\u2500 \u00a701 hero \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.hero {\n  scroll-snap-align:start;\n  min-height:100vh; display:flex; flex-direction:column;\n  padding:0 0 clamp(56px,8vh,96px);\n  position:relative; overflow:hidden;\n}\n/* subtle grid texture */\n.hero-bg {\n  position:absolute; inset:0; pointer-events:none;\n  background-image:\n    linear-gradient(rgba(232,200,64,.022) 1px,transparent 1px),\n    linear-gradient(90deg,rgba(232,200,64,.022) 1px,transparent 1px);\n  background-size:72px 72px;\n}\n/* warm glow at bottom */\n.hero-glow {\n  position:absolute; bottom:-120px; left:50%; transform:translateX(-50%);\n  width:1000px; height:500px; pointer-events:none;\n  background:radial-gradient(ellipse at center, rgba(232,200,64,.055) 0%, transparent 58%);\n}\n.hero-wm {\n  position:relative;\n  animation: fadeUp 1.1s var(--ease) .1s both;\n}\n.wm-top {\n  font-size:clamp(42px,7.2vw,108px); font-weight:700;\n  letter-spacing:.09em; text-transform:uppercase; line-height:1;\n}\n.wm-rule {\n  height:3px; background:var(--gld);\n  margin:clamp(10px,1.4vw,17px) 0;\n  transform-origin:left;\n  animation:drawRule 1.1s var(--ease) .55s both;\n}\n.wm-live {\n  font-size:clamp(80px,16.5vw,228px); font-weight:700;\n  letter-spacing:-.03em; text-transform:uppercase;\n  color:var(--gld); line-height:.88;\n  animation:fadeUp 1s var(--ease) .72s both;\n}\n.hero-descriptor {\n  margin-top:auto;\n  font-size:clamp(15px,1.1vw,16px); font-weight:500;\n  color:var(--wht); max-width:58ch; line-height:1.5;\n  letter-spacing:.01em;\n  animation:fadeUp .9s var(--ease) 1.0s both;\n}\n.hero-tagline {\n  margin-top:clamp(10px,1vw,14px);\n  font-size:clamp(14px,1.0vw,15px); font-weight:400;\n  color:var(--slv); max-width:52ch; line-height:1.65;\n  text-wrap:pretty;\n  animation:fadeUp .9s var(--ease) 1.1s both;\n}\n.hero-date {\n  margin-top:clamp(12px,1.2vw,18px);\n  font-size:13px; font-weight:500; letter-spacing:.3em; text-transform:uppercase; color:var(--slt);\n  animation:fadeUp .9s var(--ease) 1.28s both;\n}\n.hero-scroll {\n  margin-top:clamp(44px,6vh,72px);\n  display:flex; align-items:center; gap:14px;\n  animation:fadeUp .8s var(--ease) 1.7s both;\n}\n.sc-track {\n  width:1px; height:48px;\n  background:rgba(255,255,255,.1);\n  position:relative; overflow:hidden;\n}\n.sc-dot {\n  position:absolute; left:0; width:1px; height:10px;\n  background:var(--gld);\n  animation:scrollDot 2s ease-in-out 2.3s infinite;\n}\n.sc-lbl { font-size:13px; font-weight:500; letter-spacing:.24em; text-transform:uppercase; color:var(--slt); }\n\n/* \u2500\u2500 section base \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.s {\n  scroll-snap-align:start;\n  border-top:1px solid var(--ln);\n  padding:clamp(72px,10vh,128px) 0;\n  position:relative;\n}\n.s-kicker { font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--gld); display:block; margin-bottom:20px; }\n.s-title { font-size:clamp(26px,3.8vw,52px); font-weight:700; letter-spacing:-.01em; line-height:1.1; }\n\n/* \u2500\u2500 (--wht); white-space:nowrap;\n}\n.g-u { color:var(--gld); }\n.g-lbl { font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--slv); margin-top:14px; }\n\n/* \u2500\u2500 \u00a704 tracks \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.tracks-outer { margin-top:clamp(44px,5vh,64px); }\n.tracks-stage {\n  display:grid; grid-template-columns:1fr 300px; align-items:stretch;\n}\n.tracks-grid {\n  display:grid; grid-template-columns:repeat(4,1fr);\n  border:1px solid var(--ln);\n}\n.t-tile {\n  display:flex; flex-direction:column; align-items:center; justify-content:center;\n  gap:13px; padding:clamp(22px,3vw,40px) 12px;\n  border-right:1px solid var(--ln);\n  border-bottom:1px solid var(--ln);\n  cursor:pointer; position:relative; text-align:center;\n  transition:background .28s var(--ease), opacity .4s var(--ease);\n}\n.t-tile:nth-child(4n){ border-right:none; }\n.t-tile:nth-child(n+5){ border-bottom:none; }\n.t-tile::after {\n  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;\n  background:var(--tc);\n  transform:scaleX(0); transform-origin:left;\n  transition:transform .4s var(--ease);\n}\n.t-tile:hover { background:var(--sur); }\n.t-tile:hover::after,.t-tile.sel::after { transform:scaleX(1); }\n.t-tile.sel { background:var(--sur); }\n.tracks-grid.has-sel .t-tile:not(.sel) { opacity:.28; }\n.t-icon { transition:color .28s; }\n.t-tile:hover .t-icon,.t-tile.sel .t-icon { color:var(--tc) !important; }\n.t-name { font-size:12px; font-weight:600; letter-spacing:.02em; line-height:1.3; color:var(--wht); }\n\n/* peek panel */\n.peek-panel {\n  border:1px solid var(--ln); border-left:none;\n  position:relative; overflow:hidden;\n  /* height is set by the grid column \u2014 never by content */\n}\n.peek-accen s ease;\n}\n.td-inner.show { opacity:1; }\n\n/* detail \u2014 left */\n.td-kicker { font-size:14px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; margin-bottom:14px; }\n.td-title { font-size:clamp(22px,2.8vw,38px); font-weight:700; letter-spacing:-.01em; line-height:1.1; }\n.td-sub { font-size:15px; color:var(--slv); margin-top:11px; line-height:1.6; max-width:34ch; }\n.td-cta {\n  display:inline-flex; align-items:center; gap:9px;\n  margin-top:28px;\n  font-size:14px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;\n  color:var(--gld); text-decoration:none;\n  border:1px solid rgba(232,200,64,.28); padding:12px 20px; border-radius:2px;\n  cursor:pointer; background:none;\n  transition:border-color .2s,background .2s;\n}\n.td-cta:hover { border-color:var(--gld); background:rgba(232,200,64,.05); }\n\n/* detail \u2014 stats */\n.td-stats { display:flex; flex-direction:column; justify-content:center; gap:24px; }\n.td-stat-n { font-size:clamp(28px,3vw,42px); font-weight:700; letter-spacing:-.02em; line-height:1; }\n.td-stat-l { font-size:14px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--slv); margin-top:6px; }\n\n/* detail \u2014 speakers */\n.td-spkrs { display:flex; flex-direction:column; justify-content:center; gap:18px; }\n.td-spkr-lbl { font-size:14px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--slt); margin-bottom:4px; }\n.td-spkr { display:flex; align-items:center; gap:13px; }\n.td-av {\n  width:40px; height:40px; border-radius:50%;\n  background:var(--rsd); border:1px solid var(--ln2);\n  display:flex; align-items:center; justify-content:center;\n  font-size:12px; font-weight:600; letter-spacing:.02em;\n  color:rgba(232,200,64,.35); flex-shrink:0;\n}\n.td-sp-n { font-size:15px; font-weight:600; color:var(--wht); }\n.td-sp-c { font-size:13px; color:var(--slv); margin-top:2px; }\n\n/* \u2500\u2500 \u00a705 sponsorship \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u250  class=\"footer-partner-logo\">\n        /div>\n      /div>\n    /div>\n\n    <div class=\"footer-base\">\n      <span>\u00a9 2026 Startup Nation Live/span>\n    /div>\n  /div>\n/footer>\n\n<script>\n/* \u2500\u2500 track data \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst TRACKS = [\n  {n:1,id:'engineering',name:'Engineering',color:'#3D7EFF',\n   sub:'Israel produces more engineers per capita than anywhere on earth.',\n   stats:[['$32B','Wiz architecture'],['200K','monday.com tenants'],['1T','JFrog artifacts served']],\n   spkrs:[{n:'Yinon Costica',c:'Wiz'},{n:'Yoav Landman',c:'JFrog'},{n:'Ido Green',c:'monday.com'}],\n   icon:'<polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/>'},\n  {n:2,id:'ai',name:'AI',color:'#E8C840',\n   sub:'NVIDIA built one of its largest R&D centers outside the US in Israel \u2014 then paid $700M to acquire Run:ai on top of it.',\n   stats:[['#1','AI nation per capita'],['35M+','Lightricks monthly creators'],['$700M','Run:ai \u00b7 Nvidia']],\n   spkrs:[{n:'Ori Goshen',c:'AI21 Labs'},{n:'Yoav Shoham',c:'AI21 Labs'},{n:'Amnon Shashua',c:'Mobileye'}],\n   icon:'<circle cx=\"6\" cy=\"7\" r=\"2\"/><circle cx=\"18\" cy=\"6\" r=\"2\"/><circle cx=\"12\" cy=\"17\" r=\"2.2\"/><line x1=\"7.8\" y1=\"8.2\" x2=\"10.6\" y2=\"15.1\"/><line x1=\"16.3\" y1=\"7.5\" x2=\"13.2\" y2=\"15.2\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"6.4\"/>'},\n  {n:3,id:'data-ml',name:'Data & ML',color:'#00C8A8',\n   sub:'Israeli data companies have been acquired by NVIDIA, Salesforce, and Google. This track is the infrastructure layer beneath global AI.',\n   stats:[['1T','JFrog artifacts'],['$700M','Run:ai \u00b7 Nvidia'],['Petabyte','Pinecone queries daily']],\n   spkrs:[{n:'Omri Geller',c:'Nvidia'},{n:'Einat Orr',c:'lakeFS'},{n:'Edo Liberty',c:'Pinecone'}],\n   icon:'<line x1=\"4\" y1=\"20\" x2=\"20\" y2=\"20\"/><rect x=\"6\" y=\"12\" width=\"3\" height=\"6\"/><rect x=\"11\" y=\"8\" width=\"3\" height=\"10\"/><rect x=\"16\" y=\"4\" width=\"3\" height=\"14\"/>'},\n  {n:4,id:'product-design',name:'Product & Design',color:'#FF6B35',\n   sub:'A nation of 9.5 million built products used by hundreds of millions globally. Israeli product doesn\\'t build for Israel \u2014 it builds for everyone.',\n   stats:[['35M+','Lightricks MAU'],['$8B','Navan valuation'],['AI-first','both crafts, rewired']],\n   spkrs:[{n:'Tomer London',c:'Gusto'},{n:'Roy Mann',c:'monday.com'},{n:'Adi Tatarko',c:'Houzz'}],\n   icon:'<polygon points=\"12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5\"/><circle cx=\"12\" cy=\"12\" r=\"2.4\"/>'},\n  {n:5,id:'devops-sre',name:'DevOps & SRE',color:'#7B4FFF',\n   sub:'The Israeli DevOps stack runs most Fortune 500s globally. Israel doesn\\'t just ship software. It ships the tools everyone else ships software with.',\n   stats:[['24/7','wartime SLA maintained'],['#1','dev-security toolchain'],['$500B+','GMV running on Snyk']],\n   spkrs:[{n:'Itiel Shwartz',c:'Komodor'},{n:'Danny Grander',c:'Snyk'},{n:'Yoav Landman',c:'JFrog'}],\n   icon:'<path d=\"M20 12a8 8 0 1 1-2.3-5.6\"/><polyline points=\"20 4 20 8 16 8\"/>'},\n  {n:6,id:'cyber',name:'Cyber',color:'#FF3D57',\n   sub:\"Israel's defining industry \u2014 36% of all Israeli tech funding.\",\n   stats:[['36%','of Israeli tech funding'],['$32B','Wiz exit'],['30+ yrs','Check Point \u2192 Wiz']],\n   spkrs:[{n:'Assaf Rappaport',c:'Wiz'},{n:'Nadav Zafrir',c:'Check Point'},{n:'Udi Mokady',c:'CyberArk'}],\n   icon:'<path d=\"M12 3 5 6v5c0 4.4 3 7.5 7 9 4-1.5 7-4.6 7-9V6z\"/><polyline points=\"9 12 11.5 14.5 16 9.5\"/>'},\n  {n:7,id:'defense-tech',name:'Defense Tech',color:'#4CAF50',\n   sub:'The fastest-growing sector in Israeli tech \u2014 and arguably any tech ecosystem.',\n   stats:[['$1B+','raised in 2025'],['160\u2192312','startups in under 1 year'],['2\u00d7','sector size in <12 months']],\n   spkrs:[{n:'Bentzion Levinson',c:'Heven'},{n:'Alon Dror',c:'Kela'},{n:'Aviv Shapira',c:'Xtend'}],\n   icon:'<circle cx=\"12\" cy=\"12\" r=\"7\"/><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><line x1=\"12\" y1=\"2\" x2=\"12\" y2=\"6\"/><line x1=\"12\" y1=\"18\" x2=\"12\" y2=\"22\"/><line x1=\"2\" y1=\"12\" x2=\"6\" y2=\"12\"/><line x1=\"18\" y1=\"12\" x2=\"22\" y2=\"12\"/>'},\n  {n:8,id:'founders-builders',name:'Founders & Builders',color:'#FF9F1C',\n   sub:'One founder. No team. Acquired by Wix. Base44 is what happens when Israeli builders stop waiting for permission.',\n   stats:[['$32B','4 co-founders \u00b7 4 years'],['$50B+','combined value on stage'],['4 yrs','$0 \u2192 $32B']],\n   spkrs:[{n:'Assaf Rappaport',c:'Wiz'},{n:'Roy Mann',c:'monday.com'},{n:'Tomer Weingarten',c:'SentinelOne'}],\n   icon:'<polygon points=\"13 2 4 14 11 14 10 22 20 9 13 9\"/>'},\n];\n\n/* \u2500\u2500 build track tiles \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst grid = document.getElementById('tracksGrid');\nconst detail = document.getElementById('trackDetail');\nconst tdInner = document.getElementById('tdInner');\n\nTRACKS.forEach(t => {\n  const tile = document.createElement('div');\n  tile.className = 't-tile';\n  tile.dataset.n = t.n;\n  tile.style.setProperty('--tc', t.color);\n  tile.setAttribute('data-reveal','');\n  tile.setAttribute('data-d', t.n);\n  tile.innerHTML = `\n    <svg class=\"t-icon\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\"\n      fill=\"none\" stroke=\"#585858\" stroke-width=\"1.5\"\n      stroke-linecap=\"round\" stroke-linejoin=\"round\"\n      style=\"color:#585858\">${t.icon}/svg>\n    <span class=\"t-name\">${t.name}/span>`;\n  grid.appendChild(tile);\n});\n\n/* \u2500\u2500 spotlight logic \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nlet active = null;\n\nfunction renderDetail(t) {\n  const spkrs = t.spkrs.map(s => {\n    const av = s.n.split(' ').map(w=>w[0]).join('').slice(0,2);\n    return `<div class=\"td-spkr\">\n      <div class=\"td-av\">${av}/div>\n      <div><div class=\"td-sp-n\">${s.n}/div><div class=\"td-sp-c\">${s.c}/div>/div>\n    /div>`;\n  }).join('');\n\n  const stats = t.stats.map(([v,l]) =>\n    `<div><div class=\"td-stat-n\" style=\"color:var(--wht)\">${v}/div><div class=\"td-stat-l\">${l}/div>/div>`\n  ).join('');\n\n  tdInner.innerHTML = `\n    <div>\n      <p class=\"td-kicker\" style=\"color:${t.color}\">${t.name}/p>\n      <h3 class=\"td-title\">${t.name}/h3>\n      <p class=\"td-sub\">${t.sub}/p>\n      <a class=\"td-cta\" href=\"track-${t.id}.html\" style=\"color:${t.color};border-color:${t.color}33\">View full agenda \u2192/a>\n    /div>\n    <div class=\"td-stats\">${stats}/div>\n    <div class=\"td-spkrs\">\n      <p class=\"td-spkr-lbl\">Keynote speakers/p>\n      ${spkrs}\n    /div>`;\n  detail.style.borderBottom = `1px solid ${t.color}33`;\n}\n\nfunction openDetail(t) {\n  renderDetail(t);\n  /* measure real height with no clip */\n  detail.style.transition = 'none';\n  detail.style.maxHeight = 'none';\n  const h = detail.scrollHeight;\n  detail.style.maxHeight = '0px';\n  void detail.offsetWidth; /* reflow */\n  detail.style.transition = 'max-height .68s cubic-bezier(0.22,1,0.36,1)';\n  detail.style.maxHeight = h + 'px';\n  detail.classList.add('open');\n  /* fade inner in */\n  tdInner.classList.remove('show');\n  setTimeout(() => tdInner.classList.add('show'), 80);\n}\n\nfunction swapDetail(t) {\n  tdInner.classList.remove('show');\n  setTimeout(() => { renderDetail(t); tdInner.classList.add('show'); }, 220);\n}\n\nfunction closeDetail() {\n  const h = detail.scrollHeight;\n  detail.style.maxHeight = h + 'px';\n  void detail.offsetWidth;\n  detail.style.transition = 'max-height .45s cubic-bezier(0.22,1,0.36,1)';\n  detail.style.maxHeight = '0px';\n  tdInner.classList.remove('show');\n  setTimeout(() => detail.classList.remove('open'), 460);\n}\n\n/* \u2500\u2500 peek panel hover \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst peekPanel = document.getElementById('peekPanel');\nconst peekAccent = document.getElementById('peekAccent');\nconst peekHint = document.getElementById('peekHint');\nconst peekInner = document.getElementById('peekInner');\n\n/* Lock peek panel height to the tallest track content */\n(function measurePeekHeight() {\n  const probe = document.createElement('div');\n  probe.style.cssText = [\n    'position:absolute','visibility:hidden','pointer-events:none',\n    'width:' + peekPanel.offsetWidth + 'px',\n    'padding:' + getComputedStyle(peekInner).padding,\n    'box-sizing:border-box','display:flex','flex-direction:column','justify-content:center'\n  ].join(';');\n  document.body.appendChild(probe);\n  let maxH = 0;\n  TRACKS.forEach(t => {\n    const stats = t.stats.map(([v,l]) =>\n      `<div style=\"border-top:1px solid rgba(255,255,255,.07);padding-top:14px;margin-bottom:0\">\n        <div style=\"font-size:clamp(22px,2.2vw,30px);font-weight:700;line-height:1\">${v}/div>\n        <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px\">${l}/div>\n      /div>`\n    ).join('');\n    probe.innerHTML = `\n      <p style=\"font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px\">${t.name}/p>\n      <p style=\"font-size:clamp(13px,1.3vw,16px);font-weight:500;line-height:1.55;max-width:28ch\">${t.sub}/p>\n      <div style=\"display:flex;flex-direction:column;gap:18px;margin-top:26px\">${stats}/div>\n      <span style=\"margin-top:22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase\">Click to open \u2192/span>`;\n    maxH = Math.max(maxH, probe.scrollHeight);\n  });\n  document.body.removeChild(probe);\n  /* add top/bottom padding to the measured content height */\n  const pad = parseFloat(getComputedStyle(peekInner).paddingTop) * 2;\n  peekPanel.style.minHeight = (maxH + pad + 4) + 'px';\n})();\n\nfunction showPeek(t) {\n  peekAccent.style.background = t.color;\n  peekHint.classList.add('hidden');\n  const stats = t.stats.map(([v,l]) =>\n    `<div class=\"peek-stat\"><div class=\"peek-stat-n\" style=\"color:var(--wht)\">${v}/div><div class=\"peek-stat-l\">${l}/div>/div>`\n  ).join('');\n  const newContent = `\n    <p class=\"peek-track-name\" style=\"color:${t.color}\">${t.name}/p>\n    <p class=\"peek-sub\">${t.sub}/p>\n    <div class=\"peek-stats\">${stats}/div>\n    <span class=\"peek-cue\">Click to open \u2192/span>`;\n  if (peekInner.classList.contains('show')) {\n    // already visible \u2014 cross-fade without collapsing\n    peekInner.style.transition = 'opacity .18s ease';\n    peekInner.style.opacity = '0';\n    setTimeout(() => {\n      peekInner.innerHTML = newContent;\n      peekInner.style.opacity = '1';\n      peekInner.style.transition = '';\n    }, 180);\n  } else {\n    peekInner.innerHTML = newContent;\n    requestAnimationFrame(() => peekInner.classList.add('show'));\n  }\n}\n\nfunction hidePeek(keepForSelected) {\n  if (keepForSelected) return;\n  peekInner.classList.remove('show');\n  setTimeout(() => {\n    if (!peekInner.classList.contains('show')) {\n      peekAccent.style.background = '';\n      peekHint.classList.remove('hidden');\n    }\n  }, 320);\n}\n\n// Per-tile mouseenter (doesn't bubble = no jitter from child crossings)\n// mouseleave on the whole stage so hovering the peek panel doesn't hide it\nlet _peekN = null;\ngrid.querySelectorAll('.t-tile').forEach(tile => {\n  tile.addEventListener('mouseenter', () => {\n    if (window.innerWidth <= 860) return;\n    const t = TRACKS[+tile.dataset.n - 1];\n    if (_peekN === t.n) return; // already showing this track\n    _peekN = t.n;\n    showPeek(t);\n  });\n});\nconst tracksStage = document.querySelector('.tracks-stage');\ntracksStage.addEventListener('mouseleave', () => {\n  if (window.innerWidth <= 860) return;\n  _peekN = null;\n  if (active === null) hidePeek(false);\n});\n\ngrid.addEventListener('click', e => {\n  const tile = e.target.closest('.t-tile');\n  if (!tile) return;\n  const n = +tile.dataset.n;\n\n  if (active === n) {\n    /* close */\n    active = null;\n    grid.classList.remove('has-sel');\n    grid.querySelectorAll('.t-tile').forEach(el => el.classList.remove('sel'));\n    closeDetail();\n    return;\n  }\n\n  const wasOpen = active !== null;\n  active = n;\n  grid.querySelectorAll('.t-tile').forEach(el => el.classList.toggle('sel', +el.dataset.n === n));\n  grid.classList.add('has-sel');\n\n  if (window.innerWidth > 860) showPeek(TRACKS[n-1]);\n  if (wasOpen) {\n    swapDetail(TRACKS[n-1]);\n  } else {\n    openDetail(TRACKS[n-1]);\n  }\n  /* always scroll so the detail panel is visible */\n  setTimeout(() => {\n    const top = detail.getBoundingClientRect().top + window.scrollY - 72;\n    window.scrollTo({ top, behavior:'smooth' });\n  }, wasOpen ? 0 : 120);\n});\n\n/* \u2500\u2500 nav + scroll reveals \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst nav = document.getElementById('nav');\nconst hero = document.getElementById('hero');\n\nconst navObs = new IntersectionObserver(([e]) => {\n  nav.classList.toggle('show', !e.isIntersecting);\n}, { threshold: 0.15 });\nnavObs.observe(hero);\n\nconst revealObs = new IntersectionObserver(entries => {\n  entries.forEach(e => {\n    e.target.classList.toggle('in', e.isIntersecting);\n  });\n}, { threshold: 0.1, rootMargin:'0px 0px -30px 0px' });\n\ndocument.querySelectorAll('[data-reveal]').forEach(el => revealObs.observe(el));\n/script>\n\n\n\n\n\n\n<script>\n(function(){\n  var TIER_CFG={\n    innov:{count:14,spd:.66,sizeMax:2.8,alpha:.70},\n    track:{count:22,spd:.43,sizeMax:3.8,alpha:.70},\n    title:{count:38,spd:.85,sizeMax:5.5,alpha:.68}\n  };\n  var TIER_COL={\n    innov:{r:128,g:130,b:148},\n    track:{r:162,g:152,b:122},\n    title:{r:215,g:172,b:68}\n  };\n  var SPD_MS={innov:8000,track:4000,title:2800};\n\n  function rand(a,b){return a+Math.random()*(b-a);}\n  function makeStar(w,h,cfg,col){\n    var ang=rand(0,Math.PI*2),spd=rand(.04,.15)*cfg.spd;\n    var isG=cfg.sizeMax>4&&Math.random()<.12;\n    return{x:rand(0,w),y:rand(0,h),\n      size:isG?rand(3,cfg.sizeMax*1.2):rand(.3,cfg.sizeMax*.65),\n      op:rand(0,1),opDir:Math.random()>.5?1:-1,\n      opSpd:rand(.002,.007)*cfg.spd,\n      peakOp:isG?rand(.45,cfg.alpha):rand(.15,cfg.alpha),\n      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,\n      halo:isG?rand(14,24):rand(5,11),\n      col:col,isG:isG};\n  }\n  function tick(s,w,h){\n    s.x+=s.vx;s.y+=s.vy;\n    if(s.x<-20)s.x=w+10;if(s.x>w+20)s.x=-10;\n    if(s.y<-20)s.y=h+10;if(s.y>h+20)s.y=-10;\n    s.op+=s.opDir*s.opSpd;\n    if(s.op>=s.peakOp){s.op=s.peakOp;s.opDir=-1;}\n    if(s.op<=0){s.op=0;s.opDir=1;s.peakOp=rand(.12,s.col.r>200?.82:.62);}\n  }\n  function drawStar(ctx,s){\n    var r=s.col.r,g=s.col.g,b=s.col.b;\n    ctx.save();ctx.filter='blur('+s.halo*.7+'px)';\n    ctx.beginPath();ctx.arc(s.x,s.y,s.halo,0,Math.PI*2);\n    ctx.fillStyle='rgba('+r+','+g+','+b+','+s.op*.32+')';ctx.fill();ctx.restore();\n    ctx.save();ctx.filter='blur('+(s.isG?1.5:.7)+'px)';\n    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);\n    ctx.fillStyle='rgba('+r+','+g+','+b+','+s.op+')';ctx.fill();ctx.restore();\n  }\n\n  function isMob(){return window.innerWidth<=860;}\n\n  function initRow(row){\n    var canvas=row.querySelector('canvas');\n    if(!canvas)return null;\n    var tier=row.dataset.tier;\n    var cfg=TIER_CFG[tier],col=TIER_COL[tier],spd=SPD_MS[tier];\n    var stars=[],raf=null,running=false,startTime=null,stopTimer=null;\n\n    function build(w,h){stars=[];for(var i=0;i<cfg.count;i++)stars.push(makeStar(w,h,cfg,col));}\n    function loop(){\n      var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;\n      ctx.clearRect(0,0,w,h);\n      stars.forEach(function(s){tick(s,w,h);drawStar(ctx,s);});\n      if(running)raf=requestAnimationFrame(loop);\n    }\n\n    var inst={\n      activate:function(){\n        if(stopTimer){clearTimeout(stopTimer);stopTimer=null;}\n        if(!startTime)startTime=Date.now();\n        row.classList.add('tcr-active');\n        if(!running){\n          canvas.width=row.offsetWidth;canvas.height=row.offsetHeight;\n          build(canvas.width,canvas.height);\n          running=true;loop();\n        }\n      },\n      deactivateAfterCycle:function(){\n        if(stopTimer)return;\n        if(!startTime){inst.deactivateNow();return;}\n        var elapsed=Date.now()-startTime;\n        var remaining=spd-(elapsed%spd);\n        stopTimer=setTimeout(function(){inst.deactivateNow();},remaining);\n      },\n      deactivateNow:function(){\n        if(stopTimer){clearTimeout(stopTimer);stopTimer=null;}\n        startTime=null;\n        row.classList.remove('tcr-active');\n        running=false;\n        cancelAnimationFrame(raf);\n        try{canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);}catch(e){}\n      }\n    };\n\n    // Desktop hover only\n    row.addEventListener('mouseenter',function(){if(!isMob())inst.activate();});\n    row.addEventListener('mouseleave',function(){if(!isMob())inst.deactivateAfterCycle();});\n    return inst;\n  }\n\n  var allRows=Array.from(document.querySelectorAll('.tier-c-row[data-tier]'));\n  var allInsts=allRows.map(function(r){return initRow(r);});\n\n  // Mobile: forward-only sequence; last tier stays alive until all tiers leave viewport\n  var mobActive=-1,lastFired=-1,sequenceDone=false;\n  var LAST_IDX=allRows.length-1;\n\n  function getMostCentered(){\n    var mid=window.innerHeight/2,best=-1,bestDist=Infinity;\n    allRows.forEach(function(row,i){\n      var rect=row.getBoundingClientRect();\n      if(rect.bottom<0||rect.top>window.innerHeight)return;\n      var dist=Math.abs(rect.top+rect.height/2-mid);\n      if(dist<bestDist){bestDist=dist;best=i;}\n    });\n    return best;\n  }\n  function allOutOfView(){\n    return allRows.every(function(row){\n      var r=row.getBoundingClientRect();\n      return r.bottom<0||r.top>window.innerHeight;\n    });\n  }\n  function resetSequence(){\n    sequenceDone=false;lastFired=-1;mobActive=-1;\n    allInsts.forEach(function(inst){if(inst)inst.deactivateNow();});\n  }\n  function onScroll(){\n    if(!isMob())return;\n    // Only stop when ALL tiers have left the viewport (user scrolled away)\n    if(allOutOfView()){resetSequence();return;}\n    // Last tier is lit \u2014 keep it running, ignore all scroll movement while tiers visible\n    if(sequenceDone)return;\n    var c=getMostCentered();\n    if(c===mobActive)return;\n    // Only advance forward (never re-trigger a tier already passed)\n    if(c<=lastFired)return;\n    // Deactivate previous immediately (clean handoff, no cycle-wait on mobile)\n    if(mobActive>=0&&allInsts[mobActive])allInsts[mobActive].deactivateNow();\n    mobActive=c;lastFired=c;\n    if(allInsts[c])allInsts[c].activate();\n    // Last tier reached \u2014 lock sequence; animation keeps running until off-screen\n    if(c===LAST_IDX)sequenceDone=true;\n  }\n  window.addEventListener('scroll',onScroll,{passive:true});\n  if(isMob())onScroll();\n\n  // Click to email\n  var MAILTO={\n    innov:'mailto:reuvenic@gmail.com?subject=I%27d%20like%20to%20sponsor%20SNL%20Innovation%20Partners',\n    track:'mailto:reuvenic@gmail.com?subject=I%27d%20like%20to%20sponsor%20SNL%20Track%20Partners',\n    title:'mailto:reuvenic@gmail.com?subject=I%27d%20like%20to%20sponsor%20SNL%20Title%20Partners'\n  };\n  allRows.forEach(function(row){\n    row.addEventListener('click',function(){window.location.href=MAILTO[row.dataset.tier];});\n  });\n})();\n/script>\n/body>/html>"</script>
