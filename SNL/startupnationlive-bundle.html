document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\">Cyber<\/a>\n          <a href=\"track-defense-tech.html\">Defense Tech<\/a>\n          <a href=\"track-founders-builders.html\">Founders &amp; Builders<\/a>\n        <\/nav>\n      <\/div>\n\n      <!-- Pages -->\n      <div class=\"footer-col\">\n        <span class=\"footer-col-label\">Pages<\/span>\n        <nav class=\"footer-nav\">\n          <a href=\"sponsors.html\">Sponsors<\/a>\n          <a href=\"partnerships.html\">Partners<\/a>\n          <a href=\"about.html\">About the Organizers<\/a>\n        <\/nav>\n      <\/div>\n\n      <!-- Get involved -->\n      <div class=\"footer-col\">\n        <span class=\"footer-col-label\">Get involved<\/span>\n        <p class=\"footer-contact-note\">Interested in sponsoring or partnering with Startup Nation Live?<\/p>\n        <a href=\"mailto:partners@startupnation.live\" class=\"td-cta\">Contact us \u2192<\/a>\n      <\/div>\n\n    <\/div>\n\n    <!-- Partners strip -->\n    <div class=\"footer-partners\">\n      <span class=\"footer-col-label\" style=\"margin-bottom:16px;\">OUR PARTNERS<\/span>\n      <div class=\"footer-partner-logos\">\n        <div class=\"footer-partner-logo-wrap\">\n          <img src=\"a9454b0d-259d-40d7-9de1-3e6d82fc0148\" alt=\"\u05e2\u05de\u05d5\u05ea\u05ea \u05d1\u05d5\u05d2\u05e8\u05d9 \u05de\u05de&quot;\u05dd\" class=\"footer-partner-logo\">\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer-base\">\n      <span>\u00a9 2026 Startup Nation Live<\/span>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script>\n/* \u2500\u2500 track data \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst TRACKS = [\n  {n:1,id:'engineering',name:'Engineering',color:'#3D7EFF',\n   sub:'Israel produces more engineers per capita than anywhere on earth.',\n   stats:[['$32B','Wiz architecture'],['200K','monday.com tenants'],['1T','JFrog artifacts served']],\n   spkrs:[{n:'Yinon Costica',c:'Wiz'},{n:'Yoav Landman',c:'JFrog'},{n:'Ido Green',c:'monday.com'}],\n   icon:'<polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/>'},\n  {n:2,id:'ai',name:'AI',color:'#E8C840',\n   sub:'NVIDIA built one of its largest R&D centers outside the US in Israel \u2014 then paid $700M to acquire Run:ai on top of it.',\n   stats:[['#1','AI nation per capita'],['35M+','Lightricks monthly creators'],['$700M','Run:ai \u00b7 Nvidia']],\n   spkrs:[{n:'Ori Goshen',c:'AI21 Labs'},{n:'Yoav Shoham',c:'AI21 Labs'},{n:'Amnon Shashua',c:'Mobileye'}],\n   icon:'<circle cx=\"6\" cy=\"7\" r=\"2\"/><circle cx=\"18\" cy=\"6\" r=\"2\"/><circle cx=\"12\" cy=\"17\" r=\"2.2\"/><line x1=\"7.8\" y1=\"8.2\" x2=\"10.6\" y2=\"15.1\"/><line x1=\"16.3\" y1=\"7.5\" x2=\"13.2\" y2=\"15.2\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"6.4\"/>'},\n  {n:3,id:'data-ml',name:'Data & ML',color:'#00C8A8',\n   sub:'Israeli data companies have been acquired by NVIDIA, Salesforce, and Google. This track is the infrastructure layer beneath global AI.',\n   stats:[['1T','JFrog artifacts'],['$700M','Run:ai \u00b7 Nvidia'],['Petabyte','Pinecone queries daily']],\n   spkrs:[{n:'Omri Geller',c:'Nvidia'},{n:'Einat Orr',c:'lakeFS'},{n:'Edo Liberty',c:'Pinecone'}],\n   icon:'<line x1=\"4\" y1=\"20\" x2=\"20\" y2=\"20\"/><rect x=\"6\" y=\"12\" width=\"3\" height=\"6\"/><rect x=\"11\" y=\"8\" width=\"3\" height=\"10\"/><rect x=\"16\" y=\"4\" width=\"3\" height=\"14\"/>'},\n  {n:4,id:'product-design',name:'Product & Design',color:'#FF6B35',\n   sub:'A nation of 9.5 million built products used by hundreds of millions globally. Israeli product doesn\\'t build for Israel \u2014 it builds for everyone.',\n   stats:[['35M+','Lightricks MAU'],['$8B','Navan valuation'],['AI-first','both crafts, rewired']],\n   spkrs:[{n:'Tomer London',c:'Gusto'},{n:'Roy Mann',c:'monday.com'},{n:'Adi Tatarko',c:'Houzz'}],\n   icon:'<polygon points=\"12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5\"/><circle cx=\"12\" cy=\"12\" r=\"2.4\"/>'},\n  {n:5,id:'devops-sre',name:'DevOps & SRE',color:'#7B4FFF',\n   sub:'The Israeli DevOps stack runs most Fortune 500s globally. Israel doesn\\'t just ship software. It ships the tools everyone else ships software with.',\n   stats:[['24/7','wartime SLA maintained'],['#1','dev-security toolchain'],['$500B+','GMV running on Snyk']],\n   spkrs:[{n:'Itiel Shwartz',c:'Komodor'},{n:'Danny Grander',c:'Snyk'},{n:'Yoav Landman',c:'JFrog'}],\n   icon:'<path d=\"M20 12a8 8 0 1 1-2.3-5.6\"/><polyline points=\"20 4 20 8 16 8\"/>'},\n  {n:6,id:'cyber',name:'Cyber',color:'#FF3D57',\n   sub:\"Israel's defining industry \u2014 36% of all Israeli tech funding.\",\n   stats:[['36%','of Israeli tech funding'],['$32B','Wiz exit'],['30+ yrs','Check Point \u2192 Wiz']],\n   spkrs:[{n:'Assaf Rappaport',c:'Wiz'},{n:'Nadav Zafrir',c:'Check Point'},{n:'Udi Mokady',c:'CyberArk'}],\n   icon:'<path d=\"M12 3 5 6v5c0 4.4 3 7.5 7 9 4-1.5 7-4.6 7-9V6z\"/><polyline points=\"9 12 11.5 14.5 16 9.5\"/>'},\n  {n:7,id:'defense-tech',name:'Defense Tech',color:'#4CAF50',\n   sub:'The fastest-growing sector in Israeli tech \u2014 and arguably any tech ecosystem.',\n   stats:[['$1B+','raised in 2025'],['160\u2192312','startups in under 1 year'],['2\u00d7','sector size in <12 months']],\n   spkrs:[{n:'Bentzion Levinson',c:'Heven'},{n:'Alon Dror',c:'Kela'},{n:'Aviv Shapira',c:'Xtend'}],\n   icon:'<circle cx=\"12\" cy=\"12\" r=\"7\"/><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><line x1=\"12\" y1=\"2\" x2=\"12\" y2=\"6\"/><line x1=\"12\" y1=\"18\" x2=\"12\" y2=\"22\"/><line x1=\"2\" y1=\"12\" x2=\"6\" y2=\"12\"/><line x1=\"18\" y1=\"12\" x2=\"22\" y2=\"12\"/>'},\n  {n:8,id:'founders-builders',name:'Founders & Builders',color:'#FF9F1C',\n   sub:'One founder. No team. Acquired by Wix. Base44 is what happens when Israeli builders stop waiting for permission.',\n   stats:[['$32B','4 co-founders \u00b7 4 years'],['$50B+','combined value on stage'],['4 yrs','$0 \u2192 $32B']],\n   spkrs:[{n:'Assaf Rappaport',c:'Wiz'},{n:'Roy Mann',c:'monday.com'},{n:'Tomer Weingarten',c:'SentinelOne'}],\n   icon:'<polygon points=\"13 2 4 14 11 14 10 22 20 9 13 9\"/>'},\n];\n\n/* \u2500\u2500 build track tiles \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst grid = document.getElementById('tracksGrid');\nconst detail = document.getElementById('trackDetail');\nconst tdInner = document.getElementById('tdInner');\n\nTRACKS.forEach(t => {\n  const tile = document.createElement('div');\n  tile.className = 't-tile';\n  tile.dataset.n = t.n;\n  tile.style.setProperty('--tc', t.color);\n  tile.setAttribute('data-reveal','');\n  tile.setAttribute('data-d', t.n);\n  tile.innerHTML = `\n    <svg class=\"t-icon\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\"\n      fill=\"none\" stroke=\"#585858\" stroke-width=\"1.5\"\n      stroke-linecap=\"round\" stroke-linejoin=\"round\"\n      style=\"color:#585858\">${t.icon}<\/svg>\n    <span class=\"t-name\">${t.name}<\/span>`;\n  grid.appendChild(tile);\n});\n\n/* \u2500\u2500 spotlight logic \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nlet active = null;\n\nfunction renderDetail(t) {\n  const spkrs = t.spkrs.map(s => {\n    const av = s.n.split(' ').map(w=>w[0]).join('').slice(0,2);\n    return `<div class=\"td-spkr\">\n      <div class=\"td-av\">${av}<\/div>\n      <div><div class=\"td-sp-n\">${s.n}<\/div><div class=\"td-sp-c\">${s.c}<\/div><\/div>\n    <\/div>`;\n  }).join('');\n\n  const stats = t.stats.map(([v,l]) =>\n    `<div><div class=\"td-stat-n\" style=\"color:var(--wht)\">${v}<\/div><div class=\"td-stat-l\">${l}<\/div><\/div>`\n  ).join('');\n\n  tdInner.innerHTML = `\n    <div>\n      <p class=\"td-kicker\" style=\"color:${t.color}\">${t.name}<\/p>\n      <h3 class=\"td-title\">${t.name}<\/h3>\n      <p class=\"td-sub\">${t.sub}<\/p>\n      <a class=\"td-cta\" href=\"track-${t.id}.html\" style=\"color:${t.color};border-color:${t.color}33\">View full agenda \u2192<\/a>\n    <\/div>\n    <div class=\"td-stats\">${stats}<\/div>\n    <div class=\"td-spkrs\">\n      <p class=\"td-spkr-lbl\">Keynote speakers<\/p>\n      ${spkrs}\n    <\/div>`;\n  detail.style.borderBottom = `1px solid ${t.color}33`;\n}\n\nfunction openDetail(t) {\n  renderDetail(t);\n  /* measure real height with no clip */\n  detail.style.transition = 'none';\n  detail.style.maxHeight = 'none';\n  const h = detail.scrollHeight;\n  detail.style.maxHeight = '0px';\n  void detail.offsetWidth; /* reflow */\n  detail.style.transition = 'max-height .68s cubic-bezier(0.22,1,0.36,1)';\n  detail.style.maxHeight = h + 'px';\n  detail.classList.add('open');\n  /* fade inner in */\n  tdInner.classList.remove('show');\n  setTimeout(() => tdInner.classList.add('show'), 80);\n}\n\nfunction swapDetail(t) {\n  tdInner.classList.remove('show');\n  setTimeout(() => { renderDetail(t); tdInner.classList.add('show'); }, 220);\n}\n\nfunction closeDetail() {\n  const h = detail.scrollHeight;\n  detail.style.maxHeight = h + 'px';\n  void detail.offsetWidth;\n  detail.style.transition = 'max-height .45s cubic-bezier(0.22,1,0.36,1)';\n  detail.style.maxHeight = '0px';\n  tdInner.classList.remove('show');\n  setTimeout(() => detail.classList.remove('open'), 460);\n}\n\n/* \u2500\u2500 peek panel hover \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst peekPanel = document.getElementById('peekPanel');\nconst peekAccent = document.getElementById('peekAccent');\nconst peekHint = document.getElementById('peekHint');\nconst peekInner = document.getElementById('peekInner');\n\n/* Lock peek panel height to the tallest track content */\n(function measurePeekHeight() {\n  const probe = document.createElement('div');\n  probe.style.cssText = [\n    'position:absolute','visibility:hidden','pointer-events:none',\n    'width:' + peekPanel.offsetWidth + 'px',\n    'padding:' + getComputedStyle(peekInner).padding,\n    'box-sizing:border-box','display:flex','flex-direction:column','justify-content:center'\n  ].join(';');\n  document.body.appendChild(probe);\n  let maxH = 0;\n  TRACKS.forEach(t => {\n    const stats = t.stats.map(([v,l]) =>\n      `<div style=\"border-top:1px solid rgba(255,255,255,.07);padding-top:14px;margin-bottom:0\">\n        <div style=\"font-size:clamp(22px,2.2vw,30px);font-weight:700;line-height:1\">${v}<\/div>\n        <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px\">${l}<\/div>\n      <\/div>`\n    ).join('');\n    probe.innerHTML = `\n      <p style=\"font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px\">${t.name}<\/p>\n      <p style=\"font-size:clamp(13px,1.3vw,16px);font-weight:500;line-height:1.55;max-width:28ch\">${t.sub}<\/p>\n      <div style=\"display:flex;flex-direction:column;gap:18px;margin-top:26px\">${stats}<\/div>\n      <span style=\"margin-top:22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase\">Click to open \u2192<\/span>`;\n    maxH = Math.max(maxH, probe.scrollHeight);\n  });\n  document.body.removeChild(probe);\n  /* add top/bottom padding to the measured content height */\n  const pad = parseFloat(getComputedStyle(peekInner).paddingTop) * 2;\n  peekPanel.style.minHeight = (maxH + pad + 4) + 'px';\n})();\n\nfunction showPeek(t) {\n  peekAccent.style.background = t.color;\n  peekHint.classList.add('hidden');\n  const stats = t.stats.map(([v,l]) =>\n    `<div class=\"peek-stat\"><div class=\"peek-stat-n\" style=\"color:var(--wht)\">${v}<\/div><div class=\"peek-stat-l\">${l}<\/div><\/div>`\n  ).join('');\n  const newContent = `\n    <p class=\"peek-track-name\" style=\"color:${t.color}\">${t.name}<\/p>\n    <p class=\"peek-sub\">${t.sub}<\/p>\n    <div class=\"peek-stats\">${stats}<\/div>\n    <span class=\"peek-cue\">Click to open \u2192<\/span>`;\n  if (peekInner.classList.contains('show')) {\n    // already visible \u2014 cross-fade without collapsing\n    peekInner.style.transition = 'opacity .18s ease';\n    peekInner.style.opacity = '0';\n    setTimeout(() => {\n      peekInner.innerHTML = newContent;\n      peekInner.style.opacity = '1';\n      peekInner.style.transition = '';\n    }, 180);\n  } else {\n    peekInner.innerHTML = newContent;\n    requestAnimationFrame(() => peekInner.classList.add('show'));\n  }\n}\n\nfunction hidePeek(keepForSelected) {\n  if (keepForSelected) return;\n  peekInner.classList.remove('show');\n  setTimeout(() => {\n    if (!peekInner.classList.contains('show')) {\n      peekAccent.style.background = '';\n      peekHint.classList.remove('hidden');\n    }\n  }, 320);\n}\n\n// Per-tile mouseenter (doesn't bubble = no jitter from child crossings)\n// mouseleave on the whole stage so hovering the peek panel doesn't hide it\nlet _peekN = null;\ngrid.querySelectorAll('.t-tile').forEach(tile => {\n  tile.addEventListener('mouseenter', () => {\n    if (window.innerWidth <= 860) return;\n    const t = TRACKS[+tile.dataset.n - 1];\n    if (_peekN === t.n) return; // already showing this track\n    _peekN = t.n;\n    showPeek(t);\n  });\n});\nconst tracksStage = document.querySelector('.tracks-stage');\ntracksStage.addEventListener('mouseleave', () => {\n  if (window.innerWidth <= 860) return;\n  _peekN = null;\n  if (active === null) hidePeek(false);\n});\n\ngrid.addEventListener('click', e => {\n  const tile = e.target.closest('.t-tile');\n  if (!tile) return;\n  const n = +tile.dataset.n;\n\n  if (active === n) {\n    /* close */\n    active = null;\n    grid.classList.remove('has-sel');\n    grid.querySelectorAll('.t-tile').forEach(el => el.classList.remove('sel'));\n    closeDetail();\n    return;\n  }\n\n  const wasOpen = active !== null;\n  active = n;\n  grid.querySelectorAll('.t-tile').forEach(el => el.classList.toggle('sel', +el.dataset.n === n));\n  grid.classList.add('has-sel');\n\n  if (window.innerWidth > 860) showPeek(TRACKS[n-1]);\n  if (wasOpen) {\n    swapDetail(TRACKS[n-1]);\n  } else {\n    openDetail(TRACKS[n-1]);\n    /* soft-scroll so detail is visible */\n    setTimeout(() => {\n      const top = detail.getBoundingClientRect().top + window.scrollY - 72;\n      window.scrollTo({ top, behavior:'smooth' });\n    }, 120);\n  }\n});\n\n/* \u2500\u2500 nav + scroll reveals \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst nav = document.getElementById('nav');\nconst hero = document.getElementById('hero');\n\nconst navObs = new IntersectionObserver(([e]) => {\n  nav.classList.toggle('show', !e.isIntersecting);\n}, { threshold: 0.15 });\nnavObs.observe(hero);\n\nconst revealObs = new IntersectionObserver(entries => {\n  entries.forEach(e => {\n    e.target.classList.toggle('in', e.isIntersecting);\n  });\n}, { threshold: 0.1, rootMargin:'0px 0px -30px 0px' });\n\ndocument.querySelectorAll('[data-reveal]').forEach(el => revealObs.observe(el));\n<\/script>\n\n\n\n\n\n\n<script>\n(function(){\n  var TIER_CFG={\n    innov:{count:14,spd:.66,sizeMax:2.8,alpha:.70},\n    track:{count:22,spd:.43,sizeMax:3.8,alpha:.70},\n    title:{count:38,spd:.85,sizeMax:5.5,alpha:.68}\n  };\n  var TIER_COL={\n    innov:{r:128,g:130,b:148},\n    track:{r:162,g:152,b:122},\n    title:{r:215,g:172,b:68}\n  };\n  var SPD_MS={innov:8000,track:4000,title:2800};\n\n  function rand(a,b){return a+Math.random()*(b-a);}\n  function makeStar(w,h,cfg,col){\n    var ang=rand(0,Math.PI*2),spd=rand(.04,.15)*cfg.spd;\n    var isG=cfg.sizeMax>4&&Math.random()<.12;\n    return{x:rand(0,w),y:rand(0,h),\n      size:isG?rand(3,cfg.sizeMax*1.2):rand(.3,cfg.sizeMax*.65),\n      op:rand(0,1),opDir:Math.random()>.5?1:-1,\n      opSpd:rand(.002,.007)*cfg.spd,\n      peakOp:isG?rand(.45,cfg.alpha):rand(.15,cfg.alpha),\n      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,\n      halo:isG?rand(14,24):rand(5,11),\n      col:col,isG:isG};\n  }\n  function tick(s,w,h){\n    s.x+=s.vx;s.y+=s.vy;\n    if(s.x<-20)s.x=w+10;if(s.x>w+20)s.x=-10;\n    if(s.y<-20)s.y=h+10;if(s.y>h+20)s.y=-10;\n    s.op+=s.opDir*s.opSpd;\n    if(s.op>=s.peakOp){s.op=s.peakOp;s.opDir=-1;}\n    if(s.op<=0){s.op=0;s.opDir=1;s.peakOp=rand(.12,s.col.r>200?.82:.62);}\n  }\n  function drawStar(ctx,s){\n    var r=s.col.r,g=s.col.g,b=s.col.b;\n    ctx.save();ctx.filter='blur('+s.halo*.7+'px)';\n    ctx.beginPath();ctx.arc(s.x,s.y,s.halo,0,Math.PI*2);\n    ctx.fillStyle='rgba('+r+','+g+','+b+','+s.op*.32+')';ctx.fill();ctx.restore();\n    ctx.save();ctx.filter='blur('+(s.isG?1.5:.7)+'px)';\n    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);\n    ctx.fillStyle='rgba('+r+','+g+','+b+','+s.op+')';ctx.fill();ctx.restore();\n  }\n\n  function isMob(){return window.innerWidth<=860;}\n\n  function initRow(row){\n    var canvas=row.querySelector('canvas');\n    if(!canvas)return null;\n    var tier=row.dataset.tier;\n    var cfg=TIER_CFG[tier],col=TIER_COL[tier],spd=SPD_MS[tier];\n    var stars=[],raf=null,running=false,startTime=null,stopTimer=null;\n\n    function build(w,h){stars=[];for(var i=0;i<cfg.count;i++)stars.push(makeStar(w,h,cfg,col));}\n    function loop(){\n      var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;\n      ctx.clearRect(0,0,w,h);\n      stars.forEach(function(s){tick(s,w,h);drawStar(ctx,s);});\n      if(running)raf=requestAnimationFrame(loop);\n    }\n\n    var inst={\n      activate:function(){\n        if(stopTimer){clearTimeout(stopTimer);stopTimer=null;}\n        if(!startTime)startTime=Date.now();\n        row.classList.add('tcr-active');\n        if(!running){\n          canvas.width=row.offsetWidth;canvas.height=row.offsetHeight;\n          build(canvas.width,canvas.height);\n          running=true;loop();\n        }\n      },\n      deactivateAfterCycle:function(){\n        if(stopTimer)return;\n        if(!startTime){inst.deactivateNow();return;}\n        var elapsed=Date.now()-startTime;\n        var remaining=spd-(elapsed%spd);\n        stopTimer=setTimeout(function(){inst.deactivateNow();},remaining);\n      },\n      deactivateNow:function(){\n        if(stopTimer){clearTimeout(stopTimer);stopTimer=null;}\n        startTime=null;\n        row.classList.remove('tcr-active');\n        running=false;\n        cancelAnimationFrame(raf);\n        try{canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);}catch(e){}\n      }\n    };\n\n    // Desktop hover only\n    row.addEventListener('mouseenter',function(){if(!isMob())inst.activate();});\n    row.addEventListener('mouseleave',function(){if(!isMob())inst.deactivateAfterCycle();});\n    return inst;\n  }\n\n  var allRows=Array.from(document.querySelectorAll('.tier-c-row[data-tier]'));\n  var allInsts=allRows.map(function(r){return initRow(r);});\n\n  // Mobile: one active at a time, hand off after full cycle\n  var mobActive=-1;\n  function getMostCentered(){\n    var mid=window.innerHeight/2,best=-1,bestDist=Infinity;\n    allRows.forEach(function(row,i){\n      var rect=row.getBoundingClientRect();\n      if(rect.bottom<0||rect.top>window.innerHeight)return;\n      var dist=Math.abs(rect.top+rect.height/2-mid);\n      if(dist<bestDist){bestDist=dist;best=i;}\n    });\n    return best;\n  }\n  function onScroll(){\n    if(!isMob())return;\n    var c=getMostCentered();\n    if(c===mobActive)return;\n    if(mobActive>=0&&allInsts[mobActive])allInsts[mobActive].deactivateAfterCycle();\n    mobActive=c;\n    if(c>=0&&allInsts[c])allInsts[c].activate();\n  }\n  window.addEventListener('scroll',onScroll,{passive:true});\n  if(isMob())onScroll();\n\n  // Click to email\n  var MAILTO={\n    innov:'mailto:reuvenic@gmail.com?subject=I%27d%20like%20to%20sponsor%20SNL%20Innovation%20Partners',\n    track:'mailto:reuvenic@gmail.com?subject=I%27d%20like%20to%20sponsor%20SNL%20Track%20Partners',\n    title:'mailto:reuvenic@gmail.com?subject=I%27d%20like%20to%20sponsor%20SNL%20Title%20Partners'\n  };\n  allRows.forEach(function(row){\n    row.addEventListener('click',function(){window.location.href=MAILTO[row.dataset.tier];});\n  });\n})();\n<\/script>\n<\/body><\/html>"</script>
